<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="header-template">
    </header>

    <form id="checkout-form">
      <fieldset>
        <legend>Customer Information</legend>
        <label>
          First Name
          <input type="text" name="firstName" required />
        </label>
        <label>
          Last Name
          <input type="text" name="lastName" required />
        </label>
      </fieldset>

      <fieldset>
        <legend>Address</legend>
        <label>
          Street Address
          <input type="text" name="street" required />
        </label>
        <label>
          City
          <input type="text" name="city" required />
        </label>
        <label>
          State
          <input type="text" name="state" required />
        </label>
        <label>
          Zip Code
          <input type="text" name="zip" required />
        </label>
      </fieldset>

      <fieldset>
        <legend>Payment Information</legend>
        <label>
          Credit Card Number
          <input type="text" name="cardNumber" required />
        </label>
        <label>
          Expiration Date
          <input type="text" name="expDate" placeholder="MM/YY" required />
        </label>
        <label>
          Security Code
          <input type="text" name="securityCode" required />
        </label>
      </fieldset>

      <button type="submit">Complete Checkout</button>
    </form>

    <aside class="order-summary">
      <h2>Order Summary</h2>
      <p>Subtotal: <span id="subtotal">$0.00</span></p>
      <p>Tax: <span id="tax">$0.00</span></p>
      <p>Shipping: <span id="shipping">$0.00</span></p>
      <hr>
      <p><strong>Total: <span id="total">$0.00</span></strong></p>
    </aside>
  </main>
    <footer id="footer-template" class="divider">
    </footer>
  </body>
</html>
